<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocinas y Granitos | Diseño de Autor</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* Estilos base */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body, html { height: 100%; width: 100%; overflow: hidden; background-color: #000; }

        /* NAVBAR DELGADA */
        .navbar {
            position: fixed;
            top: 0; width: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 50px;
            background: rgba(255, 255, 255, 0.98);
            z-index: 1000;
        }

        /* AJUSTE DEL LOGO SEGÚN TU ARCHIVO */
        .logo-img { 
            height: 55px; /* Tamaño solicitado */
            width: auto; 
            display: block;
            object-fit: contain;
        }

        .main-nav ul { display: flex; list-style: none; gap: 25px; }
        .main-nav a { text-decoration: none; color: #1a1a1a; font-size: 13px; font-weight: 500; }

        /* CARRUSEL DE IMÁGENES */
        .carousel {
            position: relative;
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
            background-size: cover;
            background-position: center;
        }

        .slide.active { opacity: 1; }

        /* Capa oscura para que el texto blanco se lea perfecto */
        .slide::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
        }

        /* TEXTOS */
        .hero-content {
            position: absolute;
            bottom: 120px; left: 8%;
            z-index: 10;
            color: white;
            max-width: 800px;
        }

        .hero-content h1 { font-size: 55px; font-weight: 300; margin-bottom: 15px; }
        .hero-content p { font-size: 19px; font-weight: 300; margin-bottom: 30px; }
        
        .btn-discover {
            display: inline-block;
            padding: 12px 40px;
            border: 1px solid white;
            color: white;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 2px;
            border-radius: 50px;
            text-transform: uppercase;
        }

        /* FLECHAS DE NAVEGACIÓN */
        .nav-arrow {
            position: absolute;
            top: 50%; transform: translateY(-50%);
            color: white; font-size: 25px;
            cursor: pointer; z-index: 20;
            padding: 20px; opacity: 0.6;
            transition: 0.3s;
        }
        .nav-arrow:hover { opacity: 1; }
        .prev { left: 20px; }
        .next { right: 20px; }

        /* BOTÓN WHATSAPP */
        .whatsapp-btn {
            position: fixed; bottom: 30px; right: 30px;
            background-color: #25d366; color: white;
            width: 60px; height: 60px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; z-index: 1000; text-decoration: none;
        }

        @media (max-width: 768px) {
            .navbar { padding: 10px 20px; }
            .main-nav { display: none; }
            .hero-content h1 { font-size: 35px; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo-container">
            <img src="LOGO2.png" alt="Cocinas y Granitos" class="logo-img">
        </div>
        
        <nav class="main-nav">
            <ul>
                <li><a href="#">Colecciones</a></li>
                <li><a href="#">Nosotros</a></li>
                <li><a href="#">Proyectos</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>

        <div class="secondary-nav">
            <span style="font-weight: bold; font-size: 13px;">ES</span>
        </div>
    </header>

    <div class="carousel">
        <div class="slide active" style="background-image: url('cocina1.jpg');"></div>
        <div class="slide" style="background-image: url('cocina2.jpg');"></div>
        <div class="slide" style="background-image: url('cocina3.jpg');"></div>

        <div class="nav-arrow prev" onclick="moveSlide(-1)"><i class="fas fa-chevron-left"></i></div>
        <div class="nav-arrow next" onclick="moveSlide(1)"><i class="fas fa-chevron-right"></i></div>

        <div class="hero-content">
            <h1>Espacios que Inspiran</h1>
            <p>Diseño y fabricación de cocinas integrales de lujo con acabados en granito y carpintería de autor.</p>
            <a href="#" class="btn-discover">Explorar Proyectos</a>
        </div>
    </div>

    <a href="https://wa.me/TUNUMERO" class="whatsapp-btn" target="_blank">
        <i class="fab fa-whatsapp"></i>
    </a>

    <script>
        let index = 0;
        const slides = document.querySelectorAll('.slide');

        function moveSlide(n) {
            slides[index].classList.remove('active');
            index = (index + n + slides.length) % slides.length;
            slides[index].classList.add('active');
        }

        setInterval(() => moveSlide(1), 5000); // Cambia cada 5 seg
    </script>
</body>
</html>
