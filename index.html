<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocinas y Granitos | Galería de Lujo</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body, html { height: 100%; width: 100%; overflow: hidden; background-color: #000; }

        /* --- NAVBAR ESTILO BOFFI --- */
        .navbar {
            position: fixed;
            top: 0; width: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 50px;
            background: rgba(255, 255, 255, 0.98);
            z-index: 1000;
        }
        .logo-img { height: 50px; width: auto; object-fit: contain; }
        .main-nav ul { display: flex; list-style: none; gap: 25px; }
        .main-nav a { text-decoration: none; color: #1a1a1a; font-size: 13px; font-weight: 500; }

        /* --- CARRUSEL --- */
        .carousel-container {
            position: relative;
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            background-size: cover;
            background-position: center;
        }

        .slide.active { opacity: 1; }

        /* Capa de protección para el texto */
        .slide::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
        }

        /* --- CONTENIDO --- */
        .hero-content {
            position: absolute;
            bottom: 100px; left: 8%;
            z-index: 10;
            color: white;
            max-width: 800px;
        }

        .hero-content h1 { font-size: 50px; font-weight: 300; margin-bottom: 15px; text-transform: uppercase; }
        .hero-content p { font-size: 18px; font-weight: 300; margin-bottom: 30px; line-height: 1.4; }
        
        .btn-discover {
            display: inline-block;
            padding: 12px 35px;
            border: 1px solid white;
            color: white;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 2px;
            border-radius: 50px;
            text-transform: uppercase;
        }

        /* --- FLECHAS DE NAVEGACIÓN --- */
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.7);
            font-size: 24px;
            cursor: pointer;
            z-index: 20;
            padding: 20px;
            transition: 0.3s;
        }
        .nav-arrow:hover { color: white; }
        .prev { left: 20px; }
        .next { right: 20px; }

        /* WHATSAPP */
        .whatsapp-btn {
            position: fixed; bottom: 30px; right: 30px;
            background-color: #25d366; color: white;
            width: 60px; height: 60px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; z-index: 1000; text-decoration: none;
        }

        @media (max-width: 768px) {
            .navbar { padding: 8px 20px; }
            .main-nav { display: none; }
            .hero-content h1 { font-size: 35px; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <img src="logo.png" alt="Logo" class="logo-img">
        <nav class="main-nav">
            <ul>
                <li><a href="#">Colecciones</a></li>
                <li><a href="#">Nosotros</a></li>
                <li><a href="#">Proyectos</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>
        <div class="secondary-nav"><span style="font-weight: bold; font-size: 13px;">ES</span></div>
    </header>

    <div class="carousel-container">
        <div class="slide active" style="background-image: url('cocina1.jpg');"></div>
        <div class="slide" style="background-image: url('cocina2.jpg');"></div>
        <div class="slide" style="background-image: url('cocina3.jpg');"></div>
        <div class="slide" style="background-image: url('cocina4.jpg');"></div>

        <div class="nav-arrow prev" onclick="changeSlide(-1)"><i class="fas fa-chevron-left"></i></div>
        <div class="nav-arrow next" onclick="changeSlide(1)"><i class="fas fa-chevron-right"></i></div>

        <div class="hero-content">
            <h1>Cocinas de Diseño</h1>
            <p>Proyectos diseñados para convertirse en declaraciones arquitectónicas de funcionalidad y estilo.</p>
            <a href="#" class="btn-discover">Descubre más</a>
        </div>
    </div>

    <a href="https://wa.me/TUNUMERO" class="whatsapp-btn" target="_blank"><i class="fab fa-whatsapp"></i></a>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');

        function changeSlide(direction) {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + direction + slides.length) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        // Cambio automático cada 5 segundos
        setInterval(() => changeSlide(1), 5000);
    </script>
</body>
</html>
