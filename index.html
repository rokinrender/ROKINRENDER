<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boffi | Cocinas de Lujo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- ESTILOS GENERALES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body, html {
            height: 100%;
            overflow-x: hidden;
        }

        /* --- BARRA DE NAVEGACIÓN --- */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(255, 255, 255, 0.95);
            z-index: 1000;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .logo-img {
            height: 24px; /* Ajuste basado en tu archivo logo.png */
            display: block;
        }

        .main-nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        .main-nav a, .secondary-nav a {
            text-decoration: none;
            color: #000;
            font-size: 13px;
            font-weight: 400;
            transition: opacity 0.3s;
        }

        .main-nav a:hover, .secondary-nav a:hover {
            opacity: 0.5;
        }

        .secondary-nav {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        /* --- SECCIÓN PRINCIPAL (HERO) --- */
        .hero {
            position: relative;
            height: 100vh;
            width: 100%;
            /* VINCULACIÓN DE TU IMAGEN fondo.jpg */
            background: url('fondo.jpg') no-repeat center center/cover;
            display: flex;
            align-items: flex-end;
            padding: 0 60px 100px 60px;
            color: white;
        }

        /* Capa oscura suave para que el texto resalte */
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.4) 0%, transparent 50%);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 900px;
        }

        .hero-content h1 {
            font-size: 48px;
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .hero-content p {
            font-size: 22px;
            line-height: 1.4;
            margin-bottom: 35px;
            font-weight: 300;
            max-width: 85%;
        }

        .btn-discover {
            display: inline-block;
            padding: 12px 35px;
            border: 1px solid white;
            color: white;
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 2px;
            border-radius: 25px;
            transition: all 0.3s ease;
        }

        .btn-discover:hover {
            background: white;
            color: black;
        }

        /* --- BOTÓN WHATSAPP FLOTANTE --- */
        .whatsapp-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #25d366;
            color: #FFF;
            width: 60px;
            height: 60px;
            border-radius: 50px;
            text-align: center;
            font-size: 30px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            z-index: 1001;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: transform 0.3s ease;
        }

        .whatsapp-btn:hover {
            transform: scale(1.1);
            color: white;
        }

        /* Responsivo para móviles */
        @media (max-width: 768px) {
            .main-nav { display: none; }
            .hero-content h1 { font-size: 32px; }
            .hero-content p { font-size: 18px; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo-container">
            <img src="logo.png" alt="Boffi Logo" class="logo-img">
        </div>
        
        <nav class="main-nav">
            <ul>
                <li><a href="#">Colecciones</a></li>
                <li><a href="#">Nosotros</a></li>
                <li><a href="#">Marcas</a></li>
                <li><a href="#">Proyectos</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>

        <div class="secondary-nav">
            <a href="#">Tiendas</a>
            <a href="#">Catálogos</a>
            <a href="#">Entrar</a>
            <span style="font-size: 13px; font-weight: 500;">ES</span>
        </div>
    </header>

    <main class="hero">
        <div class="hero-content">
            <h1>COCINAS</h1>
            <p>Cocinas que crean una experiencia visual a través de proyectos diseñados para convertirse en declaraciones arquitectónicas.</p>
            <a href="#" class="btn-discover">DESCUBRE MÁS</a>
        </div>
    </main>

    <a href="https://wa.me/123456789" class="whatsapp-btn" target="_blank">
        <i class="fab fa-whatsapp"></i>
    </a>

</body>
</html>
