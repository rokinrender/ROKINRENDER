<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocinas y Granitos | Diseño y Arquitectura</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            color: white;
            overflow: hidden; /* Mantiene la estética de una sola pantalla */
        }

        /* --- FONDO DE LA PÁGINA --- */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Aquí busca tu archivo llamado fondo */
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), 
                        url('fondo.jpg') center/cover no-repeat;
            z-index: -1;
        }

        /* --- CABECERA / LOGO --- */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(255, 255, 255, 0.95);
            z-index: 1000;
        }

        .logo img {
            height: 50px; /* Ajusta el tamaño de tu logo aquí */
            width: auto;
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin-left: 25px;
        }

        nav ul li a {
            text-decoration: none;
            color: #333;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 400;
        }

        /* --- CONTENIDO CENTRAL --- */
        .main-content {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 10%;
        }

        .main-content h2 {
            font-size: 3rem; /* Tamaño reducido como pediste */
            letter-spacing: 8px;
            font-weight: 300;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .main-content p {
            max-width: 500px;
            font-size: 1rem;
            line-height: 1.6;
            font-weight: 300;
            margin-bottom: 30px;
        }

        .btn-explorar {
            display: inline-block;
            padding: 12px 30px;
            border: 1px solid white;
            color: white;
            text-decoration: none;
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn-explorar:hover {
            background: white;
            color: black;
        }

        /* --- WHATSAPP FLOTANTE --- */
        .whatsapp-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #25d366;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 1001;
            transition: 0.3s;
        }

        .whatsapp-btn:hover {
            transform: scale(1.1);
        }

        footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.6rem;
            letter-spacing: 2px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="background-container"></div>

    <header>
        <div class="logo">
            <img src="logo.png" alt="Cocinas y Granitos Logo">
        </div>
        <nav>
            <ul>
                <li><a href="#">Colecciones</a></li>
                <li><a href="#">Nosotros</a></li>
                <li><a href="#">Proyectos</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-content">
        <h2>COCINAS</h2>
        <p>Creamos experiencias visuales a través de proyectos diseñados para convertirse en piezas arquitectónicas únicas.</p>
        <a href="#" class="btn-explorar">Explorar Más</a>
    </main>

    <a href="https://wa.me/TUNUMERO" class="whatsapp-btn" target="_blank">
        <i class="fab fa-whatsapp"></i>
    </a>

    <footer>
        © 2024 COCINAS Y GRANITOS. TODOS LOS DERECHOS RESERVADOS.
    </footer>

</body>
</html>
