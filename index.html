<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocinas y Granitos | Diseño y Arquitectura</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-dark: #1a1a1a;
            --text-white: #ffffff;
            --whatsapp-color: #25d366;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #000;
            color: var(--text-white);
        }

        /* --- HEADER --- */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 60px;
            background: rgba(255, 255, 255, 0.98);
            z-index: 1000;
            box-shadow: 0 1px 15px rgba(0,0,0,0.05);
        }

        .logo-container {
            display: flex;
            align-items: center;
            color: #000;
        }

        .logo-text h1 {
            font-size: 1.1rem;
            letter-spacing: 3px;
            font-weight: 600;
            margin: 0;
        }

        .logo-text p {
            font-size: 0.65rem;
            letter-spacing: 5px;
            color: #666;
            margin: 0;
            text-transform: uppercase;
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin-left: 30px;
        }

        nav ul li a {
            text-decoration: none;
            color: #333;
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #888;
        }

        /* --- HERO SECTION --- */
        .hero {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            padding: 0 10%;
            /* AQUÍ COLOCAS LA IMAGEN DE LA COCINA GRIS */
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), 
                        url('https://images.unsplash.com/photo-1556911220-e15b29be8c8f?q=80&w=2070&auto=format&fit=crop') center/cover no-repeat;
        }

        .hero-content {
            max-width: 550px;
            z-index: 2;
        }

        .hero-content h2 {
            font-size: 3.5rem; /* Tamaño reducido según tu petición */
            font-weight: 300;
            letter-spacing: 8px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .hero-content p {
            font-size: 1rem;
            font-weight: 300;
            line-height: 1.8;
            margin-bottom: 35px;
            opacity: 0.9;
        }

        .btn-cta {
            padding: 14px 40px;
            border: 1px solid #fff;
            background: rgba(255,255,255,0.1);
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 3px;
            transition: 0.4s;
        }

        .btn-cta:hover {
            background: #fff;
            color: #000;
        }

        /* --- WHATSAPP FLOTANTE --- */
        .whatsapp-link {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: var(--whatsapp-color);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
